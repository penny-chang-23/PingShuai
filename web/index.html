<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="平甩功">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<title>平甩功</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --sub:#6e6e73; --card:#fff; --acc:#0a84ff; --ok:#30b350; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --sub:#98989d; --card:#1c1c1e; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang TC",sans-serif;
         min-height:100dvh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  main { flex:1; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); max-width:480px; width:100%; margin:0 auto; }
  nav { display:flex; border-top:1px solid #8884; background:var(--card); }
  nav button { flex:1; padding:12px; border:0; background:none; color:var(--sub); font-size:15px; }
  nav button.on { color:var(--acc); font-weight:600; }
  .page { display:none; } .page.on { display:block; }
  .status { text-align:center; font-weight:600; margin:8px 0; }
  .big { text-align:center; font-size:72px; font-weight:700; font-variant-numeric:tabular-nums; margin:56px 0 16px; }
  .bar { height:8px; border-radius:4px; background:#8883; overflow:hidden; margin:0 8px 32px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .5s linear; }
  .seg { display:flex; background:#8882; border-radius:10px; padding:2px; margin:12px 0; }
  .seg button { flex:1; padding:9px; border:0; border-radius:8px; background:none; color:var(--fg); font-size:16px; }
  .seg button.on { background:var(--card); font-weight:600; box-shadow:0 1px 3px #0003; }
  .btns { display:flex; gap:12px; margin-top:16px; }
  .go { flex:1; padding:16px; border:0; border-radius:14px; background:var(--acc); color:#fff; font-size:20px; font-weight:700; }
  .go.stop { background:#ff3b30; } .go.pause { background:#8e8e93; }
  .stats { display:flex; background:var(--card); border-radius:12px; padding:12px 0; margin-bottom:16px; }
  .stats div { flex:1; text-align:center; } .stats b { display:block; font-size:20px; } .stats span { font-size:12px; color:var(--sub); }
  .cal { background:var(--card); border-radius:12px; padding:12px; }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calhead b { font-size:17px; } .calhead button { border:0; background:none; color:var(--acc); font-size:22px; padding:4px 12px; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .grid .wd { font-size:12px; color:var(--sub); padding:4px 0; }
  .grid .d { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:50%;
             font-size:15px; position:relative; }
  .grid .d.done { background:var(--ok); color:#fff; font-weight:600; }
  .grid .d.today { outline:2px solid var(--acc); }
  .grid .d.sel { box-shadow:0 0 0 3px #0a84ff66; }
  .monthsum { font-size:13px; color:var(--sub); text-align:center; margin-top:8px; }
  ul { list-style:none; padding:0; margin:0; } li { background:var(--card); padding:12px; border-radius:10px; margin-bottom:8px;
       display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  li small { color:var(--sub); display:block; } li button { border:0; background:none; color:#ff3b30; font-size:14px; }
  h2 { font-size:15px; color:var(--sub); font-weight:600; margin:16px 0 8px; }
  #warn { font-size:12px; color:var(--sub); text-align:center; margin-top:12px; }
</style>
</head>
<body>
<main>
  <section id="p-timer" class="page on">
    <div class="status" id="today"></div>
    <div class="big" id="time">10:00</div>
    <div class="bar"><i id="prog"></i></div>
    <div class="seg" id="seg"><button data-m="10" class="on">10 分鐘</button><button data-m="30">30 分鐘</button></div>
    <div class="btns">
      <button class="go pause" id="pause" hidden>暫停</button>
      <button class="go" id="go">開始</button>
    </div>
    <div id="warn">練功時螢幕會保持亮著；鎖屏後音訊通常會繼續播放</div>
    <audio id="audio" preload="metadata" playsinline></audio>
  </section>

  <section id="p-log" class="page">
    <div class="stats">
      <div><b id="s-streak">0</b><span>連續打卡(天)</span></div>
      <div><b id="s-days">0</b><span>練功天數</span></div>
      <div><b id="s-min">0</b><span>累計(分)</span></div>
    </div>
    <div class="cal">
      <div class="calhead"><button id="prev">‹</button><b id="monthTitle"></b><button id="next">›</button></div>
      <div class="grid" id="grid"></div>
      <div class="monthsum" id="monthSum"></div>
    </div>
    <h2 id="listTitle"></h2><ul id="list"></ul>
  </section>
</main>
<nav><button class="on" data-p="timer">練功</button><button data-p="log">日誌</button></nav>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");
const store = {
  get records() { try { return JSON.parse(localStorage.getItem("records")) || []; } catch { return []; } },
  set records(v) { try { localStorage.setItem("records", JSON.stringify(v)); } catch {} },
};
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const dayKey = d => { d = new Date(d); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

let minutes = 10, running = false, wakeLock = null;

// ---- 防休眠 ----
async function lockScreen() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
function unlockScreen() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (running && !audio.paused && document.visibilityState === "visible") lockScreen();
});

// ---- 播放 ----
function loadTrack() {
  audio.src = `audio/${minutes}.mp4`;
  $("time").textContent = fmt(minutes * 60);
  $("prog").style.width = "0";
}
function updateTime() {
  const d = audio.duration && isFinite(audio.duration) ? audio.duration : minutes * 60;
  $("time").textContent = fmt(Math.max(0, d - audio.currentTime));
  $("prog").style.width = (audio.currentTime / d * 100) + "%";
}
audio.addEventListener("timeupdate", updateTime);
audio.addEventListener("ended", () => finish(true));

function setUI(state) { // idle | playing | paused
  const idle = state === "idle";
  $("seg").hidden = !idle;
  $("pause").hidden = idle;
  $("pause").textContent = state === "paused" ? "繼續" : "暫停";
  $("go").textContent = idle ? "開始" : "停止";
  $("go").classList.toggle("stop", !idle);
}
async function start() {
  running = true;
  try { await audio.play(); } catch { running = false; alert("無法播放音訊，請再試一次"); return; }
  lockScreen(); setUI("playing");
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: `平甩功 ${minutes} 分鐘` });
}
function togglePause() {
  if (audio.paused) { audio.play(); lockScreen(); setUI("playing"); }
  else { audio.pause(); unlockScreen(); setUI("paused"); }
}
function finish(done) {
  const sec = Math.floor(done ? (audio.duration || minutes * 60) : audio.currentTime);
  running = false; audio.pause(); unlockScreen();
  if (sec >= 30) store.records = [{ id: Date.now(), date: Date.now(), sec, preset: minutes }, ...store.records];
  loadTrack(); setUI("idle"); render();
}

$("go").onclick = () => running ? finish(false) : start();
$("pause").onclick = togglePause;
$("seg").onclick = e => {
  const m = e.target.dataset.m; if (!m) return; minutes = +m;
  [...$("seg").children].forEach(b => b.classList.toggle("on", b.dataset.m === m)); loadTrack();
};

// ---- 日誌（月曆）----
let view = new Date(); view.setDate(1);
let selected = dayKey(Date.now());

function render() {
  const recs = store.records, days = new Set(recs.map(r => dayKey(r.date)));
  const doneToday = days.has(dayKey(Date.now()));
  $("today").textContent = doneToday ? "✅ 今日已打卡" : "今天還沒練功";
  $("today").style.color = doneToday ? "var(--ok)" : "var(--sub)";

  let streak = 0, d = new Date(); if (!doneToday) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  $("s-streak").textContent = streak; $("s-days").textContent = days.size;
  $("s-min").textContent = Math.floor(recs.reduce((a, r) => a + r.sec, 0) / 60);

  // 月曆
  const y = view.getFullYear(), m = view.getMonth();
  $("monthTitle").textContent = `${y} 年 ${m + 1} 月`;
  const g = $("grid"); g.innerHTML = "";
  "日一二三四五六".split("").forEach(w => g.insertAdjacentHTML("beforeend", `<div class="wd">${w}</div>`));
  for (let i = 0; i < new Date(y, m, 1).getDay(); i++) g.insertAdjacentHTML("beforeend", "<div></div>");
  const last = new Date(y, m + 1, 0).getDate();
  let monthDays = 0, monthSec = 0;
  for (let i = 1; i <= last; i++) {
    const key = dayKey(new Date(y, m, i)), c = document.createElement("div");
    c.className = "d"; c.textContent = i;
    if (days.has(key)) { c.classList.add("done"); monthDays++; }
    if (key === dayKey(Date.now())) c.classList.add("today");
    if (key === selected) c.classList.add("sel");
    c.onclick = () => { selected = key; render(); };
    g.appendChild(c);
  }
  recs.forEach(r => { const t = new Date(r.date); if (t.getFullYear() === y && t.getMonth() === m) monthSec += r.sec; });
  $("monthSum").textContent = `本月練功 ${monthDays} 天，共 ${Math.floor(monthSec / 60)} 分鐘`;

  // 選取日紀錄
  const list = recs.filter(r => dayKey(r.date) === selected);
  const sd = selected.split("-");
  $("listTitle").textContent = `${sd[1]} 月 ${sd[2]} 日紀錄`;
  $("list").innerHTML = list.length ? "" : `<li style="color:var(--sub)">這天沒有練功紀錄</li>`;
  list.forEach(r => {
    const li = document.createElement("li"), dt = new Date(r.date);
    li.innerHTML = `<div>${dt.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })}
      <small>${Math.floor(r.sec / 60)} 分 ${r.sec % 60} 秒（${r.preset} 分鐘組）</small></div><button>刪除</button>`;
    li.querySelector("button").onclick = () => { store.records = store.records.filter(x => x.id !== r.id); render(); };
    $("list").appendChild(li);
  });
}
$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  $("p-timer").classList.toggle("on", b.dataset.p === "timer"); $("p-log").classList.toggle("on", b.dataset.p === "log");
});

loadTrack(); render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
